# Project info
site_name: Regulated Industry with IBM Bob
site_description: Regulated Industry with IBM Bob
site_author: Christopher Bienko (cdbienko@us.ibm.com)
copyright: Copyright &copy; 2026 IBM

# Repository
repo_name: bienko/bob-regulated-industry
#repo_url: https://github.com/bienko/bob-regulated-industry
#edit_uri: edit/master/docs
docs_dir: docs

nav:
  - Table of Contents: toc.md
  - Introduction: 'index.md'
  - Registration and Setup: 'setup.md'
  - 1. Analyze:
    - Understanding the Core Banking Codebase: 1-1.md
  - 2. Build:
    - Building the Carbon Teller Front-End: 2-1.md
    - Running, Debugging, and Iterating: 2-2.md
  - 3. Secure:
    - Security Analysis and Remediation: 3-1.md

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - navigation.footer
  palette:
      scheme: default

plugins:
  - mkdocs-video:
      is_video: True
      video_autoplay: False
  - macros
  - search
  - glightbox
  - print-site:
      add_to_navigation: false
      print_page_title: 'Regulated Industry with IBM Bob'
      add_print_site_banner: false
      # Table of contents
      add_table_of_contents: false
      toc_title: 'Table of Contents'
      toc_depth: 6
      # Content-related
      add_full_urls: false
      enumerate_headings: false
      enumerate_figures: false
      add_cover_page: false
      cover_page_template: ""
      path_to_pdf: ""
      include_css: true
      enabled: true

markdown_extensions:
  - sane_lists
  - pymdownx.details
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.keys
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - tables
  - pymdownx.tabbed

extra_css:
  - styles/override-print.css

extra_javascript:
  - _static/hide-toc-nav.js
